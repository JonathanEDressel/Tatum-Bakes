# Netlify configuration for TatumBakes
# Static site — no build step. Publishes the repository root.

[build]
  publish = "."
  command = ""

# Security / caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
